# Manual build check only. It publishes nothing.
#
# Releases are built locally with `make release` (signed with the release key, which is never
# stored in the repo or in CI) and uploaded by hand with `gh release create`. A debug-signed APK
# must never be published: it cannot upgrade a release install without losing data.
name: Release build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: make build
