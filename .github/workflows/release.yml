# Artifacts are built here and published as release assets — never committed to the repo.
#
# Triggered by a version tag (v*) so every release is reproducible from a tagged commit and
# the assets always come from a state that was reviewed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # shortcut: ships the debug-signed APK (installable, not Play-Store ready); add a release
      # keystore via repository secrets and switch to assembleRelease when publishing to a store.
      - name: Build artifacts
        run: |
          make build
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/treineco-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
